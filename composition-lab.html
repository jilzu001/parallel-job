<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>세계관 × 직업 · 고정 좌표 조합</title><link rel="stylesheet" href="style.css"><style>.controls{display:grid;grid-template-columns:1fr 1fr;gap:14px}#picture{aspect-ratio:4/3}.layers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.layer{background:#e3e2d6;border:1px solid #bcae8b;padding:8px}.layer canvas{aspect-ratio:4/5}.layer p{font-size:12px;margin:8px 0 0}#info{font-size:15px}.display{background:var(--paper);border:4px solid var(--ink);padding:6px;margin:24px 0}input{font:inherit;width:100%;padding:10px}label{font-size:15px}@media(max-width:400px){.controls{grid-template-columns:1fr}.layers{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="shell"><header>평행세계 · 부품 조합</header><main><h1 style="font-size:32px">세계관 × 직업<br>고정 좌표 조합</h1><p>세계관과 직업이 어울리는 후보를 고른 뒤, 같은 좌표에 부품을 겹칩니다.</p><div class="controls"><label>세계관<select id="world"></select></label><label>직업<select id="role"></select></label><label>캐릭터 성별<select id="sex"><option>여성</option><option>남성</option></select></label><label>저장된 조합 번호<input id="seed" type="number" min="0" value="54321"></label></div><button class="primary" id="shuffle">같은 세계·직업에서 다른 부품 고르기</button><div class="display"><canvas id="picture" role="img" aria-label="세계관과 직업에 맞춘 캐릭터"></canvas></div><p id="info"></p><details open><summary>실제로 겹친 공통 크기 부품</summary><p class="note">아래 각 부품은 모두 64×80 원본입니다. 조립 시 크기 변경 없이 (0,0)에 겹칩니다. 화면 확대는 전체 결과에만 적용됩니다.</p><div id="layers" class="layers"></div></details><p class="note">이 버전은 고정 좌표와 후보 선택을 구현한 도트 스프라이트 시제품입니다. 기존 AI 부품을 늘이거나 줄여 사용하지 않습니다. 그림의 세부 표현은 아직 사용자 예시와 차이가 있어 검수가 필요합니다.</p></main></div><script src="sprite-rig.js"></script><script src="wardrobe.js"></script><script>
let worlds,roles;const world=document.getElementById('world'),role=document.getElementById('role');function jobs(){role.innerHTML=worlds[Number(world.value)].jobs.map((j,i)=>`<option value="${i}">${j}</option>`).join('')}
function render(){const w=worlds[Number(world.value)],r=roles[Number(role.value)],p=SpriteWorld.paint(document.getElementById('picture'),{seed:Number(document.getElementById('seed').value)>>>0,sex:document.getElementById('sex').value},w,r);document.getElementById('info').textContent=`${w.name} · ${w.jobs[Number(role.value)]} / 배경: ${p.backgroundUse} / 의상: ${p.outfitSource} / 헤어: ${p.hairSource}`;const holder=document.getElementById('layers');holder.replaceChildren();SpriteRig.layers(p).forEach((layer,i)=>{const item=document.createElement('div');item.className='layer';const c=document.createElement('canvas');c.width=64;c.height=80;c.getContext('2d').drawImage(layer,0,0);const label=document.createElement('p');label.textContent=['등 장비','몸·얼굴','헤어·장식','의상','도구','앞 손'][i];item.append(c,label);holder.append(item)})}
Promise.all([fetch('data/worlds.json').then(r=>r.json()),fetch('data/roles.json').then(r=>r.json()),SpriteWorld.ready]).then(([w,r])=>{worlds=w;roles=r;world.innerHTML=w.map((x,i)=>`<option value="${i}">${x.name}</option>`).join('');world.value='1';jobs();role.value='5';render();world.onchange=()=>{jobs();render()};role.onchange=render;document.getElementById('sex').onchange=render;document.getElementById('seed').onchange=render;document.getElementById('shuffle').onclick=()=>{document.getElementById('seed').value=crypto.getRandomValues(new Uint32Array(1))[0];render()}}).catch(()=>document.getElementById('info').textContent='이미지를 불러오지 못했습니다.');
</script></body></html>
