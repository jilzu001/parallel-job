<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>평행세계 · 이미지 부품 검수</title><style>
*{box-sizing:border-box}body{margin:0;background:#eee9d7;color:#183d43;font:17px/1.65 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:24px 18px}h1{font-size:30px;line-height:1.4}h2{font-size:24px}nav{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0}a{color:inherit}nav a,button{padding:8px 12px;border:1px solid #183d43;background:#fff8e0;font:inherit;cursor:pointer;border-radius:4px}section{margin:32px 0;border-top:2px solid #183d43;padding-top:18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}.item{border:1px solid #bcae8b;background:#fff9e8;overflow:hidden;border-radius:5px}.part{background-color:#e2e4dc;background-image:linear-gradient(45deg,#c6cbc3 25%,transparent 25%),linear-gradient(-45deg,#c6cbc3 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#c6cbc3 75%),linear-gradient(-45deg,transparent 75%,#c6cbc3 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}canvas{display:block;width:100%;aspect-ratio:1;image-rendering:pixelated}.name{padding:8px;font-size:14px;line-height:1.45}.name strong{font:700 13px monospace;color:#8b5e23;display:block}.note{font-size:15px}.sheet{max-width:100%;height:auto}.controls{display:flex;gap:10px;flex-wrap:wrap}.error{color:#a33428}details{margin:20px 0}summary{cursor:pointer;font-weight:bold}@media(max-width:400px){.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main><p>PARALLEL JOB / ASSET REVIEW V1</p><h1>이미지 부품 전체 검수</h1><p id="total">부품 목록을 불러오는 중…</p><p>남성·여성 기본형을 포함한 공통 재료입니다. 완성 결과를 한 장씩 그리는 대신, 이 재료들을 조합합니다.</p><p class="note">현재는 그림 검수용 초안입니다. 실제 조합에 필요한 크기·위치·겹침 보정과 모든 조합 검증은 아직 완료되지 않았습니다. 게임 본화면에는 적용하지 않았습니다.</p><div class="controls"><button id="bg-light">밝은 바탕</button><button id="bg-dark">어두운 바탕</button><button id="bg-check">투명 체크 바탕</button></div><nav id="nav"></nav><div id="sets"></div><p class="note">수정 요청은 부품 번호로 알려 주세요. 예: “HEAD-03 머리가 너무 큼”, “CLOTH-14 색감 수정”.</p></main><script>
const sets=document.getElementById('sets');
fetch('assets/parts-v1/manifest.json').then(r=>r.json()).then(data=>{
document.getElementById('total').textContent=`${data.reduce((n,s)=>n+s.items.length,0)}개 재료 · ${data.length}개 분류`;
for(const set of data){const a=document.createElement('a');a.href='#'+set.id;a.textContent=set.title;document.getElementById('nav').append(a);const section=document.createElement('section');section.id=set.id;const title=document.createElement('h2');title.textContent=`${set.title} · ${set.items.length}개`;section.append(title);const note=document.createElement('p');note.className='note';note.textContent=set.use;section.append(note);const grid=document.createElement('div');grid.className='grid';section.append(grid);const image=new Image();image.src='assets/parts-v1/'+set.file;image.onload=()=>set.items.forEach((name,i)=>{const item=document.createElement('article');item.className='item';const holder=document.createElement('div');holder.className='part';const canvas=document.createElement('canvas');canvas.width=240;canvas.height=240;canvas.setAttribute('role','img');canvas.setAttribute('aria-label',name);holder.append(canvas);const ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;const sw=image.width/set.cols,sh=image.height/set.rows,scale=Math.min(240/sw,240/sh);ctx.drawImage(image,(i%set.cols)*sw,Math.floor(i/set.cols)*sh,sw,sh,(240-sw*scale)/2,(240-sh*scale)/2,sw*scale,sh*scale);const label=document.createElement('div');label.className='name';const code=document.createElement('strong');code.textContent=set.prefix+'-'+String(i+1).padStart(2,'0');label.append(code,document.createTextNode(name));item.append(holder,label);grid.append(item)});image.onerror=()=>{note.textContent='이미지를 불러오지 못했습니다.';note.className='error'};const detail=document.createElement('details');const summary=document.createElement('summary');summary.textContent='원본 묶음 이미지 보기';const original=document.createElement('img');original.src=image.src;original.alt=set.title+' 원본';original.className='sheet part';original.loading='lazy';detail.append(summary,original);section.append(detail);sets.append(section)}
}).catch(()=>document.getElementById('total').textContent='목록을 불러오지 못했습니다. 새로고침해 주세요.');
for(const [id,color] of [['bg-light','#fff8df'],['bg-dark','#213139'],['bg-check',null]])document.getElementById(id).onclick=()=>document.querySelectorAll('.part').forEach(p=>{p.style.backgroundImage=color?'none':'';p.style.backgroundColor=color||''});
</script></body></html>
